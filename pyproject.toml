[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splitbot"
version = "0.1.0"
description = "Expense-tracking assistant for a group chat: records expenses after confirmation and answers questions about the group's money."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "openai",
    "python-telegram-bot",
    "httpx",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "respx",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Default run = unit + integration only. LLM evals (real API calls) are run explicitly.
testpaths = ["tests/unit", "tests/integration", "tests/concurrency", "tests/e2e"]
# Lets tests import shared test doubles as `tests.fakes`.
pythonpath = ["."]
