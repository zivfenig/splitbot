[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splitbot"
version = "0.1.0"
description = "Telegram bot that turns group-chat messages into Splitwise expenses, safely."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "openai",
    "python-telegram-bot",
    "mcp",
    "httpx",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "respx",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Default run = unit + integration only. LLM evals (real API calls) are run explicitly.
testpaths = ["tests/unit", "tests/integration"]
